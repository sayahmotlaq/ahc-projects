name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Resolve database connection
        id: db
        run: |
          set +e
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -n "$DB_URL" ]; then CANDS="$DB_URL"; else
            CANDS=""
            for host in aws-0-eu-central-1 aws-1-eu-central-1 aws-0-ap-south-1 aws-1-ap-south-1 aws-0-ap-southeast-1 aws-1-ap-southeast-1 aws-0-eu-west-1 aws-1-eu-west-1 aws-0-us-east-1 aws-1-us-east-1 aws-0-eu-west-2 aws-1-eu-west-2 aws-0-eu-north-1 aws-1-eu-north-1 aws-0-ap-northeast-1 aws-1-ap-northeast-1 aws-0-ca-central-1 aws-1-ca-central-1 aws-0-sa-east-1 aws-1-sa-east-1 aws-0-us-west-1 aws-1-us-west-1 aws-0-ap-southeast-2 aws-1-ap-southeast-2 aws-0-ap-northeast-2 aws-1-ap-northeast-2 aws-0-us-east-2 aws-1-us-east-2 aws-0-eu-west-3 aws-1-eu-west-3; do
              CANDS="$CANDS postgresql://postgres.$REF:PASS@$host.pooler.supabase.com:5432/postgres"
            done
          fi
          for c in $CANDS; do
            url=$(python3 -c "import os,sys,urllib.parse; print(sys.argv[1].replace('PASS', urllib.parse.quote(os.environ['DB_PASSWORD'], safe='')))" "$c")
            out=$(PGCONNECT_TIMEOUT=8 psql "$url" -c 'select 1' 2>&1); rc=$?
            if [ $rc -eq 0 ]; then echo "connected via ${c#*@}" | tee -a "$RUNNER_TEMP/diag.txt"; echo "url=$url" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "${c#*@}: $(echo "$out" | head -1 | cut -c1-160)" | tee -a "$RUNNER_TEMP/diag.txt"
          done
          echo "could not connect to database — migrations skipped (run the SQL manually in Supabase SQL Editor)"; echo "url=" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostics
        if: always()
        continue-on-error: true
        run: |
          git config user.name deploy-bot; git config user.email bot@users.noreply.github.com
          (git fetch -q origin logs:logs 2>/dev/null && git checkout -q logs) || git checkout -q --orphan logs
          git rm -rfq --cached . 2>/dev/null || true; mkdir -p logs
          { echo "run ${{ github.run_id }} $(date -u)"; cat "$RUNNER_TEMP/diag.txt" 2>/dev/null; } > logs/last-run.txt
          git add -f logs/last-run.txt; git commit -qm "diag ${{ github.run_id }}" || true; git push -q origin HEAD:logs; git checkout -q main
      - name: Run migrations
        if: steps.db.outputs.url != ''
        run: |
          : > "$RUNNER_TEMP/seed.txt"
          for f in $(ls supabase/migrations/*.sql | sort); do echo "== $f"; psql "${{ steps.db.outputs.url }}" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | grep -v "NOTICE:.*\(already exists\|does not exist\)" | tee -a "$RUNNER_TEMP/seed.txt"; test ${PIPESTATUS[0]} -eq 0; done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Seed reference data
        id: seed
        run: node scripts/seed.mjs 2>&1 | tee -a "$RUNNER_TEMP/seed.txt"; test ${PIPESTATUS[0]} -eq 0
      - name: Import projects (one-time per file)
        if: steps.db.outputs.url != ''
        run: node scripts/import_projects.mjs 2>&1 | tee -a "$RUNNER_TEMP/seed.txt"; test ${PIPESTATUS[0]} -eq 0
      - name: Publish seed log
        if: always()
        continue-on-error: true
        run: |
          git config user.name deploy-bot; git config user.email bot@users.noreply.github.com
          (git fetch -q origin logs:logs 2>/dev/null && git checkout -q logs) || git checkout -q --orphan logs
          mkdir -p logs; { echo "run ${{ github.run_id }} $(date -u)"; cat "$RUNNER_TEMP/seed.txt" 2>/dev/null | tail -80; } > logs/seed.txt
          git add -f logs/seed.txt; git commit -qm "seed ${{ github.run_id }}" || true; git push -q origin HEAD:logs; git checkout -q main

  pages:
    needs: database
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject public config
        run: |
          cat > site/config.js <<EOF
          window.AHC_CONFIG = { url: "${{ secrets.SUPABASE_URL }}", anon: "${{ secrets.SUPABASE_ANON_KEY }}", version: "${{ github.sha }}" };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
