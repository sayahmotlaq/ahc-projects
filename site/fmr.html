<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تقرير حالة الأنظمة الحرجة — تجمع الأحساء الصحي</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#123B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="share.css">
<style>
.bhero .cd b small{color:#F2C94C}
.bhero .bst{grid-template-columns:repeat(4,1fr)}.bhero .bst div.dec{display:flex;align-items:center;gap:10px;text-align:start;padding:10px 14px}.bhero .bst div.dec span{margin:0}
details.grp .row{padding-inline-start:14px;background:#FAFBFC}
.row .m small.wrap2{white-space:normal;color:var(--text);font-size:12.8px;line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.meta2>span:not(.tag){display:inline-flex;align-items:center;gap:3px}.meta2 svg{width:13px;height:13px}.meta2 .late{color:var(--red);font-weight:700}
.row{align-items:flex-start}.row .dot{margin-top:7px}.row .chev{margin-top:4px}.row .e{margin-top:1px}
.fsub span{font-weight:700}.fsub .r{color:var(--red)}.fsub .a{color:#8A6508}.fsub .g{color:var(--sage)}
.fstrip{display:flex;gap:2px;margin-top:7px;direction:rtl}.fstrip i{flex:1;height:8px;border-radius:2px;max-width:14px}
.sbar{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;margin:6px 0 3px;background:var(--line2)}.sbar i{display:block;height:100%}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 4px 0;font-size:11.5px;color:var(--muted)}.lgd>span{display:inline-flex;align-items:center;gap:5px}.lgd .dot{width:8px;height:8px}
.miss{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;background:#FFF8EC;font-size:12.5px;color:#7A5A06;border-top:1px solid var(--line2)}.miss svg{width:16px;height:16px;flex:none;margin-top:2px}.miss b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 14px}.chips.flat{padding:0}
.chips span{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12.5px}.chips .dot{width:8px;height:8px}
.cnote{margin:0;padding:10px 14px 2px;font-size:12.5px;color:var(--muted)}
details.grp summary .tag{margin-inline-start:4px}
.obs+.obs{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}.obs>b{display:block;font-size:14.5px;line-height:1.5;margin-bottom:8px;color:var(--navy)}
.proc{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}.proc svg{width:15px;height:15px;color:var(--lblue)}.proc b{color:var(--text)}
.obs .pb{direction:rtl}.obs .pb i{background:var(--lblue);left:auto;right:0}
.note.stale{background:#FFF4F2}.note.stale small{color:var(--red)}
.ms li .dot{width:9px;height:9px}.sheet h4 .dot{width:9px;height:9px}
.late-t{color:var(--red)}
@media (min-width:721px){.wrap{max-width:760px}.top .in{max-width:760px}}
@media print{.chev,.lgd{display:none}.bhero{break-inside:avoid}.row{break-inside:avoid}.fstrip i,.sbar i,.dot{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="xload"><div class="xspin"></div><p>جارٍ فتح التقرير…</p></div></div>
<script type="module" src="js/fmr_view.js"></script>
</body>
</html>
