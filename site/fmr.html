<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تقرير حالة الأنظمة الحرجة — تجمع الأحساء الصحي</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#123B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body{background:#F3F5F8;margin:0;font-family:Tajawal,system-ui,sans-serif}
.fx-top{position:sticky;top:0;z-index:10;background:#123B5C;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.fx-top b{font-size:14.5px} .fx-top small{opacity:.75;font-size:12px} .fx-top .sp{flex:1}
.fx-top button{white-space:nowrap;font:inherit;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:7px 12px;cursor:pointer}
.fx-top button.pri{background:#27A8DF;border-color:#27A8DF}
.fx-wrap{max-width:1180px;margin:16px auto;padding:0 16px 40px}
.fx-msg{max-width:420px;margin:12vh auto;background:#fff;border-radius:16px;padding:26px;text-align:center;box-shadow:0 10px 30px rgba(18,36,47,.12)}
.fx-msg h1{color:#123B5C;font-size:19px} .fx-msg input{font:inherit;font-size:18px;text-align:center;letter-spacing:4px;border:1px solid #E3E8EE;border-radius:10px;padding:10px;width:160px;margin:10px 0}
.fx-dlg{position:fixed;inset:0;background:rgba(14,47,74,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.fx-card{background:#fff;width:min(520px,100%);border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:700px){.fx-dlg{align-items:center}.fx-card{border-radius:18px}}
.fx-card h3{margin:0 0 6px;color:#123B5C} .fx-card label{display:block;margin-top:10px;font-size:13px;font-weight:700;color:#66768A}
.fx-card input,.fx-card textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid #E3E8EE;border-radius:10px;padding:9px;margin-top:4px}
.fx-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.fx-row button{font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;border:1px solid #E3E8EE;background:#fff;cursor:pointer} .fx-row .pri{background:#123B5C;color:#fff;border-color:#123B5C}
.fx-ok{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2E8B57;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;z-index:60}
@media print{.fx-top{display:none}.fx-wrap{margin:0;max-width:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="fx-msg"><p>جارٍ فتح التقرير…</p></div></div>
<script type="module" src="js/fmr_view.js"></script>
</body>
</html>
